replicaCount: 2

image:
  repository: afsharidevops/hermes-smart-router
  tag: "0.6.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

upstream:
  # Leave both empty to let the chart point the router at the optional
  # in-cluster upstream (9router or OmniRoute). Set them explicitly for an
  # external gateway.
  baseUrl: ""
  healthUrl: ""

# Optional in-cluster model gateway. When enabled together with
# upstreamServer.backend, the chart deploys 9router or OmniRoute and points the
# Smart Router at it. Disable it and set upstream.baseUrl/healthUrl for an
# external gateway.
upstreamServer:
  enabled: false
  backend: 9router  # 9router | omniroute
  nineRouter:
    image:
      repository: decolua/9router
      tag: latest
      pullPolicy: IfNotPresent
    port: 20128
    # The gateway needs JWT_SECRET, INITIAL_PASSWORD, API_KEY_SECRET, and
    # MACHINE_ID_SALT (plus REQUIRE_API_KEY/AUTH_COOKIE_SECURE when used).
    # Point existingSecret at a Secret whose keys are exactly those env names.
    existingSecret: ""
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  omniRoute:
    image:
      repository: diegosouzapw/omniroute
      tag: latest
      pullPolicy: IfNotPresent
    dashboardPort: 20128
    apiPort: 20129
    # OmniRoute also needs OMNIROUTE_API_KEY, STORAGE_ENCRYPTION_KEY,
    # MACHINE_ID_SALT, and OMNIROUTE_WS_BRIDGE_SECRET.
    existingSecret: ""
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1536Mi

router:
  mode: observe
  policy: heuristic
  requireAuth: true
  stickyBackend: redis
  fastModel: combo-fast
  standardModel: combo-standard
  strongModel: combo-strong
  orchestrator:
    # auto: the planner flag, dangerous command patterns and unregistered or
    # high-risk tools require an approve/reject decision. always: every step
    # waits for a decision. never: no approval gate, trusted lab deployments only.
    approvalMode: auto
    plannerTier: standard
    reviewerTier: strong

secrets:
  # Create this Secret before install. Required keys:
  # hmac-secret, admin-api-key, client-api-key, bootstrap-admin-password,
  # postgres-password, redis-password
  existingSecret: hermes-smart-router-secrets

postgres:
  enabled: true
  image: postgres:16-alpine
  database: hermes_router
  user: hermes_router
  storage: 10Gi

redis:
  enabled: true
  image: redis:7-alpine
  storage: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
