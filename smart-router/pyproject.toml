[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-smart-router"
version = "0.2.0"
description = "Privacy-preserving calibrated tier router for Hermes Linux Stack"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
  "starlette>=0.40,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
smart-router-replay = "smart_router.eval.replay:main"
smart-router-calibrate = "smart_router.eval.calibrate:main"
smart-router-report = "smart_router.eval.report:main"

[tool.setuptools.packages.find]
where = ["src"]
