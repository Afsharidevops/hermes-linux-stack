name: Publish Smart Router

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version without a leading v
        required: true
        default: 0.1.0
  push:
    tags:
      - smart-router-v*.*.*

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dockerhub-release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME#smart-router-v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            printf 'Invalid semantic version: %s\n' "$version" >&2
            exit 2
          }
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: smart-router
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            afsharidevops/hermes-smart-router:${{ steps.version.outputs.value }}
            afsharidevops/hermes-smart-router:sha-${{ github.sha }}
