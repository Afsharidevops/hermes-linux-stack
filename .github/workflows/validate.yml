name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n install.sh manage.sh
      - name: Check provisioning script syntax
        run: |
          node --check scripts/bootstrap-openwebui.mjs
          python3 -c 'import ast, pathlib; [ast.parse(path.read_text(), filename=str(path)) for path in pathlib.Path("scripts").glob("*.py")]'
      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet
      - name: Test interactive installer
        run: tests/smoke.sh
      - name: Ensure secrets are ignored
        run: |
          test "$(git check-ignore .env)" = ".env"
          test "$(git check-ignore data/hermes/.env)" = "data/hermes/.env"
          test "$(git check-ignore data/open-webui/webui.db)" = "data/open-webui/webui.db"
          test "$(git check-ignore data/caddy/Caddyfile)" = "data/caddy/Caddyfile"
